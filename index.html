<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kakuro</title>
  <style>
    :root {
      --cell-size: 50px;
      --gap-size: 4px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #171b24;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      display: flex;
      flex-direction: column;
    }

    h1 {
      margin: 6px 0 2px;
      font-size: 28px;
      line-height: 1.05;
    }

    .info {
      width: 100%;
      margin: 0 auto 3px;
      padding: 0 8px;
      color: #d8dcea;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
      font-size: clamp(8px, 1.45vw, 14px);
      line-height: 1.1;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      align-items: center;
      margin: 4px auto;
      padding: 0 8px;
    }

    .box {
      background: #252b38;
      border: 1px solid #3a4254;
      border-radius: 9px;
      padding: 5px 9px;
      min-width: 78px;
    }

    .box small {
      display: block;
      color: #aeb7cc;
      margin-bottom: 1px;
      font-size: 10px;
    }

    .box strong {
      font-size: 16px;
    }

    select,
    button {
      padding: 7px 9px;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 13px;
      cursor: pointer;
    }

    select {
      background: #30384a;
      border: 1px solid #4c566d;
    }

    button {
      background: #0b76ef;
    }

    button.gray {
      background: #4a5367;
    }

    button.red {
      background: #bd3140;
    }

    .board-area {
      flex: 1;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 3px 8px;
    }

    #board {
      display: inline-grid;
      gap: var(--gap-size);
      background: transparent;
      padding: 3px;
      max-width: 100vw;
      max-height: 100%;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      position: relative;
    }

    .spacer {
      background: transparent;
      box-shadow: none;
      pointer-events: none;
    }

    .white,
    .clue {
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.28);
    }

    .white {
      background: #f3f5fa;
      overflow: hidden;
    }

    .clue {
      background: linear-gradient(135deg, #0c1018, #232c3b);
      overflow: hidden;
    }

    .diag-line {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .triangle-label {
      position: absolute;
      transform: translate(-50%, -50%);
      font-size: 12px;
      font-weight: bold;
      text-shadow: 0 1px 0 rgba(0,0,0,0.5);
      line-height: 1;
      user-select: none;
      pointer-events: none;
    }

    .triangle-label.right {
      left: 67%;
      top: 33%;
      color: #ffd166;
    }

    .triangle-label.down {
      left: 33%;
      top: 67%;
      color: #7cc7ff;
    }

    input {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: #121722;
      text-align: center;
      font-size: 25px;
      font-weight: bold;
    }

    .white.active {
      outline: 3px solid #7aa7ff;
      outline-offset: 0;
    }

    .white.correct {
      background: #c9f7ce;
    }

    .white.wrong {
      background: #ffc4c4;
    }

    .white.hint {
      background: #d8ecff;
    }

    #message {
      min-height: 18px;
      font-size: 14px;
      font-weight: bold;
      margin: 0 0 2px;
      line-height: 1.15;
    }

    .rules {
      width: 100%;
      padding: 0 8px 6px;
      color: #c7cfdf;
      text-align: center;
      line-height: 1;
      font-size: clamp(8px, 1.3vw, 13px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .rules b {
      color: white;
    }

    @media (max-height: 720px) {
      h1 {
        font-size: 24px;
        margin-top: 4px;
      }

      .box {
        padding: 4px 7px;
      }

      select,
      button {
        padding: 6px 8px;
        font-size: 12px;
      }

      #message {
        font-size: 12px;
        min-height: 15px;
      }
    }

    @media (max-width: 620px) {
      :root {
        --cell-size: 42px;
        --gap-size: 3px;
      }

      input {
        font-size: 21px;
      }

      .triangle-label {
        font-size: 10px;
      }

      .box {
        min-width: 70px;
      }
    }

    @media (max-width: 430px) {
      :root {
        --cell-size: 36px;
        --gap-size: 3px;
      }

      h1 {
        font-size: 22px;
      }

      .info {
        font-size: 6.5px;
      }

      .bar {
        gap: 4px;
        margin: 2px auto;
      }

      select,
      button {
        padding: 5px 6px;
        font-size: 11px;
      }

      .box {
        min-width: 62px;
        padding: 3px 5px;
      }

      .box strong {
        font-size: 14px;
      }

      input {
        font-size: 19px;
      }

      .triangle-label {
        font-size: 9px;
      }

      .rules {
        font-size: 6px;
      }
    }
  </style>
</head>
<body>
  <h1>Kakuro</h1>

  <div class="info">
    Beyaz kutulara 1-9 arası sayı yaz. Sarı sayı sağdaki toplamı, mavi sayı aşağıdaki toplamı gösterir.
  </div>

  <div class="bar">
    <select id="level">
      <option value="easy">Kolay</option>
      <option value="medium" selected>Orta</option>
      <option value="hard">Zor</option>
    </select>

    <div class="box">
      <small>Süre</small>
      <strong id="time">00:00</strong>
    </div>

    <div class="box">
      <small>Hata</small>
      <strong id="mistakes">0</strong>
    </div>

    <div class="box">
      <small>İpucu</small>
      <strong id="hints">3</strong>
    </div>
  </div>

  <div class="bar">
    <button id="checkBtn">Kontrol Et</button>
    <button id="hintBtn" class="gray">İpucu</button>
    <button id="newBtn" class="gray">Yeni Oyun</button>
    <button id="solutionBtn" class="red">Çözümü Göster</button>
  </div>

  <div class="board-area">
    <div id="board"></div>
  </div>

  <div id="message"></div>

  <div class="rules">
    <b>Kural:</b> Satır ve sütundaki karelerin toplamı, verilen sayıya eşit olmalı. Aynı sayıya ait satır ve sütun içinde sayılar tekrar etmemeli.
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var puzzles = {
        easy: [
          "######",
          "##498#",
          "#7952#",
          "#3829#",
          "#861##",
          "######"
        ],
        medium: [
          "########",
          "##498###",
          "#7952###",
          "#28#431#",
          "###1758#",
          "#496183#",
          "#7623###",
          "########"
        ],
        hard: [
          "##########",
          "##4983####",
          "#87592####",
          "#72##8514#",
          "#63#41235#",
          "###8249###",
          "#7418#34##",
          "#52479136#",
          "####61873#",
          "##########"
        ]
      };

      var board = document.getElementById("board");
      var levelSelect = document.getElementById("level");
      var timeEl = document.getElementById("time");
      var mistakesEl = document.getElementById("mistakes");
      var hintsEl = document.getElementById("hints");
      var messageEl = document.getElementById("message");

      var solution = [];
      var seconds = 0;
      var timer = null;
      var mistakes = 0;
      var hints = 3;
      var finished = false;

      document.getElementById("checkBtn").addEventListener("click", checkGame);
      document.getElementById("hintBtn").addEventListener("click", giveHint);
      document.getElementById("newBtn").addEventListener("click", newGame);
      document.getElementById("solutionBtn").addEventListener("click", showSolution);
      levelSelect.addEventListener("change", newGame);
      window.addEventListener("resize", fitBoard);

      function formatTime(value) {
        var m = Math.floor(value / 60);
        var s = value % 60;
        return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
      }

      function isWhite(r, c) {
        return solution[r] && solution[r][c] && solution[r][c] !== "#";
      }

      function valueAt(r, c) {
        return Number(solution[r][c]);
      }

      function runTotal(r, c, dr, dc) {
        var total = 0;
        var count = 0;
        var nr = r + dr;
        var nc = c + dc;

        while (isWhite(nr, nc)) {
          total += valueAt(nr, nc);
          count++;
          nr += dr;
          nc += dc;
        }

        return count > 0 ? total : "";
      }

      function makeCell(r, c) {
        var div = document.createElement("div");
        div.className = "cell";

        if (isWhite(r, c)) {
          div.className += " white";
          div.setAttribute("data-r", r);
          div.setAttribute("data-c", c);

          var input = document.createElement("input");
          input.maxLength = 1;
          input.inputMode = "numeric";
          input.setAttribute("data-r", r);
          input.setAttribute("data-c", c);

          input.addEventListener("input", function () {
            this.value = this.value.replace(/[^1-9]/g, "");
            div.classList.remove("correct", "wrong", "hint");
            messageEl.textContent = "";
          });

          input.addEventListener("focus", function () {
            clearActive();
            div.classList.add("active");
          });

          input.addEventListener("blur", function () {
            div.classList.remove("active");
          });

          input.addEventListener("keydown", function (event) {
            if (event.key === "ArrowUp") moveFocus(r, c, -1, 0);
            if (event.key === "ArrowDown") moveFocus(r, c, 1, 0);
            if (event.key === "ArrowLeft") moveFocus(r, c, 0, -1);
            if (event.key === "ArrowRight") moveFocus(r, c, 0, 1);

            if (
              event.key === "ArrowUp" ||
              event.key === "ArrowDown" ||
              event.key === "ArrowLeft" ||
              event.key === "ArrowRight"
            ) {
              event.preventDefault();
            }
          });

          div.appendChild(input);
          return div;
        }

        var right = runTotal(r, c, 0, 1);
        var down = runTotal(r, c, 1, 0);

        if (right !== "" || down !== "") {
          div.className += " clue";

          var svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          svg.setAttribute("viewBox", "0 0 100 100");
          svg.setAttribute("preserveAspectRatio", "none");
          svg.setAttribute("class", "diag-line");

          var line = document.createElementNS("http://www.w3.org/2000/svg", "line");
          line.setAttribute("x1", "0");
          line.setAttribute("y1", "0");
          line.setAttribute("x2", "100");
          line.setAttribute("y2", "100");
          line.setAttribute("stroke", "rgba(255,255,255,0.45)");
          line.setAttribute("stroke-width", "2.5");
          svg.appendChild(line);

          div.appendChild(svg);

          if (right !== "") {
            var rightEl = document.createElement("div");
            rightEl.className = "triangle-label right";
            rightEl.textContent = right;
            div.appendChild(rightEl);
          }

          if (down !== "") {
            var downEl = document.createElement("div");
            downEl.className = "triangle-label down";
            downEl.textContent = down;
            div.appendChild(downEl);
          }

          return div;
        }

        div.className += " spacer";
        return div;
      }

      function buildBoard() {
        board.innerHTML = "";
        board.style.gridTemplateColumns = "repeat(" + solution[0].length + ", var(--cell-size))";

        for (var r = 0; r < solution.length; r++) {
          for (var c = 0; c < solution[r].length; c++) {
            board.appendChild(makeCell(r, c));
          }
        }

        fitBoard();
      }

      function fitBoard() {
        if (!solution.length) return;

        var cols = solution[0].length;
        var rows = solution.length;

        var boardArea = document.querySelector(".board-area");
        var availableWidth = window.innerWidth - 24;
        var availableHeight = boardArea.clientHeight - 12;
        var gap = window.innerWidth <= 430 ? 3 : 4;

        var byWidth = Math.floor((availableWidth - gap * (cols - 1)) / cols);
        var byHeight = Math.floor((availableHeight - gap * (rows - 1)) / rows);
        var size = Math.max(28, Math.min(52, byWidth, byHeight));

        document.documentElement.style.setProperty("--cell-size", size + "px");
        document.documentElement.style.setProperty("--gap-size", gap + "px");
      }

      function clearActive() {
        var cells = document.querySelectorAll(".white");
        for (var i = 0; i < cells.length; i++) {
          cells[i].classList.remove("active");
        }
      }

      function getInput(r, c) {
        return document.querySelector('input[data-r="' + r + '"][data-c="' + c + '"]');
      }

      function getCell(r, c) {
        return document.querySelector('.white[data-r="' + r + '"][data-c="' + c + '"]');
      }

      function moveFocus(r, c, dr, dc) {
        var nr = r + dr;
        var nc = c + dc;

        while (solution[nr] && solution[nr][nc] !== undefined) {
          var input = getInput(nr, nc);
          if (input) {
            input.focus();
            return;
          }

          nr += dr;
          nc += dc;
        }
      }

      function checkGame() {
        if (finished) return;

        var inputs = document.querySelectorAll("input");
        var allFilled = true;
        var allCorrect = true;

        for (var i = 0; i < inputs.length; i++) {
          var input = inputs[i];
          var r = Number(input.getAttribute("data-r"));
          var c = Number(input.getAttribute("data-c"));
          var cell = getCell(r, c);
          var answer = solution[r][c];

          cell.classList.remove("correct", "wrong");

          if (input.value === "") {
            allFilled = false;
            allCorrect = false;
            cell.classList.add("wrong");
          } else if (input.value === answer) {
            cell.classList.add("correct");
          } else {
            allCorrect = false;
            cell.classList.add("wrong");
          }
        }

        if (!allFilled) {
          messageEl.textContent = "Eksik kutular var.";
          messageEl.style.color = "#ffd166";
          return;
        }

        if (!allCorrect) {
          mistakes++;
          mistakesEl.textContent = mistakes;
          messageEl.textContent = "Bazı sayılar yanlış.";
          messageEl.style.color = "#ff8a8a";
          return;
        }

        finished = true;
        clearInterval(timer);
        messageEl.textContent = "Tebrikler! Bulmacayı çözdün.";
        messageEl.style.color = "#7CFC90";
      }

      function giveHint() {
        if (finished || hints <= 0) return;

        var empty = [];
        var inputs = document.querySelectorAll("input");

        for (var i = 0; i < inputs.length; i++) {
          if (inputs[i].value === "") {
            empty.push(inputs[i]);
          }
        }

        if (empty.length === 0) return;

        var chosen = empty[Math.floor(Math.random() * empty.length)];
        var r = Number(chosen.getAttribute("data-r"));
        var c = Number(chosen.getAttribute("data-c"));

        chosen.value = solution[r][c];

        var cell = getCell(r, c);
        cell.classList.remove("wrong");
        cell.classList.add("hint");

        hints--;
        hintsEl.textContent = hints;

        messageEl.textContent = "Bir ipucu verildi.";
        messageEl.style.color = "#7cc7ff";
      }

      function showSolution() {
        var inputs = document.querySelectorAll("input");

        for (var i = 0; i < inputs.length; i++) {
          var input = inputs[i];
          var r = Number(input.getAttribute("data-r"));
          var c = Number(input.getAttribute("data-c"));
          input.value = solution[r][c];

          var cell = getCell(r, c);
          cell.classList.remove("wrong");
          cell.classList.add("correct");
        }

        finished = true;
        clearInterval(timer);

        messageEl.textContent = "Çözüm gösterildi.";
        messageEl.style.color = "#7cc7ff";
      }

      function startTimer() {
        clearInterval(timer);
        seconds = 0;
        timeEl.textContent = "00:00";

        timer = setInterval(function () {
          if (finished) return;
          seconds++;
          timeEl.textContent = formatTime(seconds);
        }, 1000);
      }

      function newGame() {
        solution = puzzles[levelSelect.value].slice();
        mistakes = 0;
        hints = levelSelect.value === "hard" ? 2 : 3;
        finished = false;

        mistakesEl.textContent = mistakes;
        hintsEl.textContent = hints;
        messageEl.textContent = "";

        buildBoard();
        startTimer();

        var firstInput = document.querySelector("input");
        if (firstInput) firstInput.focus();
      }

      newGame();
    });
  </script>
</body>
</html>
